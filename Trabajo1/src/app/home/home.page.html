<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Página de Inicio (Menú)
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inicio de Sesión</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <ion-label position="floating">Usuario</ion-label>
    <ion-input [(ngModel)]="usuario.username" placeholder="Ingresa tu usuario"></ion-input>

    <br />

    <ion-label position="floating">Contraseña</ion-label>
    <ion-input [(ngModel)]="usuario.password" type="password" placeholder="Ingresa tu contraseña">
      <ion-input-password-toggle slot="end"></ion-input-password-toggle>
    </ion-input>

    <ion-item>
      <ion-label>{{ mensaje }}</ion-label>
    </ion-item>

    <ion-button expand="full" (click)="ingresar()">INGRESAR</ion-button>
    <ion-button expand="full" (click)="olvido()">RECUPERAR</ion-button>

    <ion-button expand="full" color="secondary" [routerLink]="['/register']">REGISTRAR</ion-button>
  </div>
</ion-content>
